services:
  redis:

    image: 'redis:alpine'
    volumes:
      - 'redis:/data'
    env_file:
      - ./project.env
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping']
  backend:
    build: backend
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - project.env
    user: 'node'
    volumes:
      - ./backend/src:/home/node/app/src
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:4200/apis/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  capstone-sql-test:
    driver: local
  redis:
    driver: local